[package]
name = "mockreplay"
version = "0.1.0"
edition = "2021"
description = "Record real HTTP traffic once, replay it for tests — a lighter WireMock/Mockoon alternative"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/mockreplay"
readme = "README.md"
keywords = ["http", "mock", "testing", "proxy", "wiremock"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "mockreplay"
path = "src/lib.rs"

[[bin]]
name = "mockreplay"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
